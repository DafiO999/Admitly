name: admitly-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - admitly_postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PROFILE_ACCESS_SECRET: ${PROFILE_ACCESS_SECRET:?Set PROFILE_ACCESS_SECRET}
      DEMO_DATA_MODE: ${DEMO_DATA_MODE:-false}
      COLLEGE_SCORECARD_API_KEY: ${COLLEGE_SCORECARD_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_LETTER_MODEL: ${GEMINI_LETTER_MODEL:-gemini-3.5-flash-lite}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-mock}
      LETTER_UPLOAD_DIR: /data/uploads
    volumes:
      - admitly_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - admitly-api
      egress:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r => { if (!r.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_ORIGIN: http://admitly-api:3001
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_ORIGIN: http://admitly-api:3001
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
      ingress:
        aliases:
          - admitly-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s

networks:
  default:
    name: admitly-prod-internal
    internal: true
  ingress:
    external: true
    name: codex-pool-ingress
  egress:
    name: admitly-prod-egress

volumes:
  admitly_postgres_data:
    name: admitly-prod-postgres-data
  admitly_uploads:
    name: admitly-prod-uploads
