services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: admitly
      POSTGRES_USER: admitly
      POSTGRES_PASSWORD: admitly
    ports:
      - "127.0.0.1:${ADMITLY_DEV_DB_PORT:-5432}:5432"
    volumes:
      - admitly_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admitly -d admitly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  admitly_dev_pgdata:
